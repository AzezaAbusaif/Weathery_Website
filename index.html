<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="weather-container">
        <h1>Weather App </h1>
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name (e.g., Amman)">
            <button id="searchBtn">Search</button>
        </div>
        
        <div class="weather-result" id="weatherResult" style="display: none;">
            <h2 id="cityName">City Name</h2>
            <p id="temperature">Temperature: <span>--</span>°C</p>
            <p id="description">Condition: <span>--</span></p>

            <h3>5-Day Forecast:</h3>
    <div id="forecastContainer" style="display: flex; gap: 10px; margin-top: 10px;"></div>
        </div>
    </div>
        <script src="script.js"></script>

</body>
</html>
